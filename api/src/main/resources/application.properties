spring.application.name=api

# ==============================================================
# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/rifas_db
# ACUÉRDATE DE CAMBIAR EL USUARIO Y LA CONTRASEÑA POR LOS TUYOS
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================================================
# CONFIGURACIÓN DE HIBERNATE (ORM)
# ==============================================================
# update: Crea las tablas si no existen y las actualiza si hay cambios (Ideal para desarrollo)
# En producción, esto debería cambiarse a 'validate' o usar Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update

# Muestra el código SQL que Spring genera por detrás (útil para debuggear)
spring.jpa.show-sql=true

# Formatea el SQL en la consola para que sea legible
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
# El puerto donde correrá el backend
server.port=8080

# ==============================================================
# CONFIGURACIÓN DE CORS (MUY IMPORTANTE)
# ==============================================================
# Permitimos los orígenes de desarrollo de Frontend (Vite 5173, Angular 4200, etc.)
spring.mvc.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200,http://127.0.0.1:5173
